          type: string
        parameters:
          type: object
          additionalProperties: true

    AttackRunResponse:
      type: object
      required: [run_id, scenario_id, decision, blocked, started_at, finished_at]
      properties:
        run_id:
          type: string
        scenario_id:
          type: string
        decision:
          $ref: '#/components/schemas/Decision'
        reason_codes:
          type: array
          items:
            type: string
        blocked:
          type: boolean
        audit_ids:
          type: array
          items:
            type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    LatencySnapshot:
      type: object
      required: [window, request_count, checks]
      properties:
        window:
