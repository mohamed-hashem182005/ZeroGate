          type: integer
        pending_jit:
          type: integer
        unhealthy_devices:
          type: integer
        last_audit_seq:
          type: integer
        generated_at:
          type: string
          format: date-time

    DevicePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        page:
          $ref: '#/components/schemas/PageInfo'

    VaultPage:
      type: object
      required: [items, page]
      properties:
        items:
