      properties:
        resource_id:
          type: string
        source_ip:
          type: string
        nonce:
          type: string
        timestamp:
          type: string
          format: date-time
        signature:
          type: string

    SpaKnockResponse:
      type: object
      required: [resource_id, port, opened_until]
      properties:
        resource_id:
          type: string
        port:
          type: integer
        opened_until:
          type: string
          format: date-time

    AttackScenario:
      type: object
      required: [id, name, description, expected_decision, expected_reason_codes]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        expected_decision:
          $ref: '#/components/schemas/Decision'
        expected_reason_codes:
          type: array
          items:
            type: string
        requires:
          type: array
          items:
            type: string

    AttackRunRequest:
      type: object
